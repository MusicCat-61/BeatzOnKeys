name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run non-interactive test harness
        run: dotnet run --project BeatzOnKeys.Tests -c Release
      - name: Build portable folder
        shell: cmd
        run: |
          set "BOK_VERSION=%GITHUB_REF_NAME:~1%"
          call publish.bat
      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path Build_Output\* -DestinationPath BeatzOnKeys-win-x64.zip -CompressionLevel Optimal
          (Get-FileHash BeatzOnKeys-win-x64.zip -Algorithm SHA256).Hash + '  BeatzOnKeys-win-x64.zip' | Set-Content BeatzOnKeys-win-x64.zip.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            BeatzOnKeys-win-x64.zip
            BeatzOnKeys-win-x64.zip.sha256
