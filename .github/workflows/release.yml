name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run non-interactive test harness
        run: dotnet run --project BeatzOnKeys.Tests -c Release
      - name: Build single-file executable
        shell: cmd
        run: |
          set "BOK_VERSION=%GITHUB_REF_NAME:~1%"
          call publish.bat
      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path Build_Output\* -DestinationPath BeatzOnKeys-win-x64.zip -CompressionLevel Optimal
          (Get-FileHash BeatzOnKeys-win-x64.zip -Algorithm SHA256).Hash + '  BeatzOnKeys-win-x64.zip' | Set-Content BeatzOnKeys-win-x64.zip.sha256
          Copy-Item Build_Output\BeatzOnKeys.exe .\BeatzOnKeys.exe
          (Get-FileHash BeatzOnKeys.exe -Algorithm SHA256).Hash + '  BeatzOnKeys.exe' | Set-Content BeatzOnKeys.exe.sha256
      - name: Select release notes for this tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $specific = "release-notes/$tag.md"
          if (Test-Path $specific) {
            Write-Host "Using $specific"
            Copy-Item $specific RELEASE_BODY.md
          } else {
            Write-Host "No $specific found; falling back to the full archive."
            Copy-Item RELEASE_NOTES.md RELEASE_BODY.md
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            BeatzOnKeys.exe
            BeatzOnKeys.exe.sha256
            BeatzOnKeys-win-x64.zip
            BeatzOnKeys-win-x64.zip.sha256
